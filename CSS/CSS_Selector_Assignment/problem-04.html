    margin: 20px 0 25px 0;
  }

  table.main {

  td.box {

    box-shadow: 1px 1px 3px #999999;
    color: #ffffff;
    text-align: center;
    padding: 4px;

  .green   { background-color: #7d9a3b; }

  .yellow  { background-color: #f0c93a; }
  .gray    { background-color: #7a6a6a; }
  .peach   { background-color: #f7ddc2; border: 1px solid #333333; color: #333333; }

  .silicon {
    background-color: #7d9a3b;
    border: 2px solid #4a5c22;
    border-radius: 4px;
    box-shadow: 1px 1px 3px #999999;
    color: #ffffff;
    padding: 4px;
  }

  .si-number { text-align: right;  color: #ffffff; margin: 0; padding: 0 6px 0 0; }
  .si-symbol { text-align: left;   color: #ffffff; margin: 0; padding: 0 0 0 10px; }

  td.footer-cell {
    background-color: #8a9a4a;
    border: 1px solid #ffffff;
    color: #222222;
    text-align: left;
    padding: 4px 0 0 6px;
  }

  td.footer-light {
    background-color: #b9c98a;
    border: 1px solid #ffffff;
    color: #222222;
    text-align: left;
    padding: 4px 0 0 6px;

</style>
